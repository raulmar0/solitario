server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # Es un juego que solo habla con el propio navegador: nada de recursos externos.
  # OJO: se usa `expires` y no `add_header Cache-Control` en los location de abajo,
  # porque un add_header dentro de un location anula TODOS los heredados del server
  # y estas cabeceras de seguridad dejarían de enviarse.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

  # El HTML se revalida siempre; el resto se cachea un rato corto, que no hay
  # build con hash en el nombre de los ficheros.
  location ~* \.(js|css|svg|png|ico|webmanifest)$ {
    expires 1h;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
