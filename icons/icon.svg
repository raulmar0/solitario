<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Solitario">
  <!-- Una mano en abanico sobre el tapete: dos cartas boca abajo y la del medio
       boca arriba con su pica. La misma geometría que dibuja scripts/iconos.py
       para los PNG; si cambia una, hay que cambiar la otra. -->
  <defs>
    <linearGradient id="fieltro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18764a"/>
      <stop offset="1" stop-color="#093a24"/>
    </linearGradient>
    <linearGradient id="dorso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5fa8"/>
      <stop offset="1" stop-color="#1c3d75"/>
    </linearGradient>
    <!-- La carta, en su sitio antes de girar: el abanico gira sobre la mano
         (256, 450.56), no sobre el centro de cada carta. -->
    <g id="dorso-carta">
      <rect x="172.8" y="129.3" width="166.4" height="233" rx="17.9" fill="#a9baae"/>
      <rect x="178.4" y="134.9" width="155.2" height="221.8" rx="12.3" fill="url(#dorso)"/>
      <rect x="185.05" y="141.55" width="141.9" height="208.5" rx="5.65"
            fill="none" stroke="#b5c5dc" stroke-width="13.3"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="113" fill="url(#fieltro)"/>

  <use href="#dorso-carta" transform="rotate(-24 256 450.56)"/>
  <use href="#dorso-carta" transform="rotate(24 256 450.56)"/>

  <rect x="172.8" y="129.3" width="166.4" height="233" rx="17.9" fill="#a9baae"/>
  <rect x="178.4" y="134.9" width="155.2" height="221.8" rx="12.3" fill="#fdfcf8"/>
  <g fill="#16232b" transform="translate(139.52 130.83) scale(0.455)">
    <circle cx="191.8" cy="289.8" r="71"/>
    <circle cx="320.2" cy="289.8" r="71"/>
    <polygon points="256,87 357.4,289.8 154.6,289.8"/>
    <path d="M240.8 289.8 Q 240.8 380 166.4 418.2 L 345.6 418.2 Q 271.2 380 271.2 289.8 Z"/>
  </g>
</svg>
